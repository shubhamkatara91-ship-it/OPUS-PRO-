name: OPUS PRO backend checks
# Verify the current main branch, including provenance, diagnostics, and cycle tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q main.py signal_engine.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
